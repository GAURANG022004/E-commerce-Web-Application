<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            padding: 40px 20px;
        }

        /* Floating shapes */
        .shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            filter: blur(60px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: -100px;
            left: -100px;
        }

        .shape:nth-child(2) {
            width: 400px;
            height: 400px;
            background: rgba(255, 107, 107, 0.3);
            border-radius: 50%;
            bottom: -150px;
            right: -100px;
            animation-delay: 5s;
        }

        .shape:nth-child(3) {
            width: 200px;
            height: 200px;
            background: rgba(78, 205, 196, 0.3);
            border-radius: 50%;
            top: 50%;
            left: 10%;
            animation-delay: 10s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }

        .form-container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            margin: 0 auto;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3),
                        inset 0 0 100px rgba(255, 255, 255, 0.1);
            padding: 45px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .form-icon i {
            font-size: 32px;
            color: white;
        }

        .form-title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .form-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px 15px 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: white;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .form-control:focus + .input-icon {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        textarea.form-control {
            padding-left: 20px;
            min-height: 120px;
            resize: vertical;
        }

        .row .form-group {
            margin-bottom: 25px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 35px;
        }

        .btn-submit {
            flex: 1;
            padding: 16px 30px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn-cancel {
            flex: 1;
            padding: 16px 30px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Image preview */
        .image-preview {
            width: 100%;
            height: 200px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
        }

        .image-placeholder i {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* Responsive */
        @media (max-width: 576px) {
            .form-card {
                padding: 30px 20px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Background Shapes -->
    <div class="shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <div class="form-icon">
                    <i th:class="${product.id == null} ? 'fas fa-plus' : 'fas fa-edit'"></i>
                </div>
                <h2 class="form-title" th:text="${product.id == null ? 'Add New Product' : 'Edit Product'}">Product Form</h2>
                <p class="form-subtitle" th:text="${product.id == null} ? 'Fill in the details to add a new product' : 'Update the product information below'">Fill in product details</p>
            </div>

            <!-- Image Preview -->
            <div class="image-preview" id="imagePreview">
                <div class="image-placeholder" th:if="${product.imageurl == null or product.imageurl.isEmpty()}">
                    <i class="fas fa-image"></i>
                    <p>Product image preview will appear here</p>
                </div>
                <img th:if="${product.imageurl != null and !product.imageurl.isEmpty()}" th:src="${product.imageurl}" alt="Product Preview">
            </div>

            <form th:action="@{/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Product Name</label>
                            <div class="input-group">
                                <i class="fas fa-tag input-icon"></i>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="Enter product name" required>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Price ($)</label>
                            <div class="input-group">
                                <i class="fas fa-dollar-sign input-icon"></i>
                                <input type="number" th:field="*{price}" class="form-control" placeholder="0.00" step="0.01" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" placeholder="Describe your product..." rows="3"></textarea>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Category</label>
                            <div class="input-group">
                                <i class="fas fa-folder input-icon"></i>
                                <input type="text" th:field="*{category}" class="form-control" placeholder="e.g., Electronics" required>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label class="form-label">Stock Quantity</label>
                            <div class="input-group">
                                <i class="fas fa-boxes input-icon"></i>
                                <input type="number" th:field="*{stock}" class="form-control" placeholder="0" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Image URL</label>
                    <div class="input-group">
                        <i class="fas fa-link input-icon"></i>
                        <input type="text" th:field="*{imageurl}" class="form-control" placeholder="https://example.com/image.jpg">
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-save me-2"></i>Save Product
                    </button>
                    <a href="/products" class="btn-cancel">
                        <i class="fas fa-times me-2"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Image preview functionality
        document.querySelector('input[name="imageurl"]').addEventListener('input', function() {
            const preview = document.getElementById('imagePreview');
            const url = this.value;
            if (url) {
                preview.innerHTML = '<img src="' + url + '" alt="Product Preview" onerror="this.src=\'https://via.placeholder.com/400x200?text=Invalid+Image\'">';
            } else {
                preview.innerHTML = '<div class="image-placeholder"><i class="fas fa-image"></i><p>Product image preview will appear here</p></div>';
            }
        });
    </script>
</body>
</html>
