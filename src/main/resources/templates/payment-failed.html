<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Payment Failed | ShopSphere</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<style>
    body {
        background: #f8f9fa;
        font-family: 'Poppins', sans-serif;
    }

    .navbar {
        background: white;
        box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .brand {
        color: #4361ee !important;
        font-weight: 700;
    }

    .failed-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .failed-card {
        background: white;
        border-radius: 18px;
        padding: 45px;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0,0,0,.08);
        max-width: 600px;
        width: 100%;
    }

    .failed-icon {
        width: 85px;
        height: 85px;
        border-radius: 50%;
        background: #f8d7da;
        color: #dc3545;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 25px;
        font-size: 40px;
    }
</style>
```

</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">

```
    <a class="navbar-brand brand" href="/customer/products">
        <i class="bi bi-bag-heart-fill me-2"></i>
        ShopSphere
    </a>

    <a href="/logout"
       class="btn btn-outline-danger btn-sm">
        Logout
    </a>

</div>
```

</nav>

<div class="container failed-container">

```
<div class="failed-card">

    <div class="failed-icon">

        <i class="bi bi-x-lg"></i>

    </div>


    <h1 class="fw-bold text-danger">
        Payment Failed
    </h1>


    <p class="text-muted mt-3">

        We could not verify your payment.

        Your cart has <strong>not</strong> been cleared.

        You can safely try again.

    </p>


    <div class="alert alert-warning mt-4">

        <i class="bi bi-exclamation-triangle me-2"></i>

        If money was deducted from your account,
        please wait for Razorpay/bank confirmation.

    </div>


    <div class="d-flex gap-2 justify-content-center mt-4">

        <a href="/customer/cart"
           class="btn btn-primary">

            <i class="bi bi-arrow-left me-1"></i>

            Return to Cart

        </a>

        <a href="/customer/products"
           class="btn btn-outline-secondary">

            Continue Shopping

        </a>

    </div>

</div>
```

</div>

</body>
</html>
