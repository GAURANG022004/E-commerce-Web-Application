<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Join Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #ff6b6b, #4ecdc4);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Animated Background Shapes */
        .shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            filter: blur(50px);
            opacity: 0.6;
            animation: shapeFloat 25s infinite ease-in-out;
        }

        .shape:nth-child(1) {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 107, 0.5);
            border-radius: 50%;
            top: -150px;
            left: -100px;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 400px;
            height: 400px;
            background: rgba(78, 205, 196, 0.4);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            bottom: -200px;
            right: -100px;
            animation-delay: 5s;
        }

        .shape:nth-child(3) {
            width: 200px;
            height: 200px;
            background: rgba(247, 37, 133, 0.4);
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            top: 50%;
            left: 10%;
            animation-delay: 10s;
        }

        .shape:nth-child(4) {
            width: 250px;
            height: 250px;
            background: rgba(76, 201, 240, 0.4);
            border-radius: 40% 60% 70% 30% / 40% 50% 50% 60%;
            bottom: 20%;
            right: 20%;
            animation-delay: 15s;
        }

        @keyframes shapeFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(50px, -50px) rotate(90deg) scale(1.1); }
            50% { transform: translate(0, 50px) rotate(180deg) scale(1); }
            75% { transform: translate(-50px, -25px) rotate(270deg) scale(0.9); }
        }

        .register-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.3),
                        inset 0 0 100px rgba(255, 255, 255, 0.1);
            padding: 45px;
            position: relative;
            overflow: hidden;
            animation: cardSlideIn 0.8s ease-out;
        }

        @keyframes cardSlideIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: shimmer 8s infinite linear;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            z-index: 1;
        }

        .header-section {
            text-align: center;
            margin-bottom: 35px;
        }

        .header-icon {
            width: 90px;
            height: 90px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            border-radius: 25px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.4);
            animation: iconBounce 2s infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .header-icon i {
            font-size: 40px;
            color: white;
        }

        .header-section h2 {
            color: white;
            font-weight: 700;
            font-size: 32px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .header-section p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
        }

        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .form-control {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        .form-control:focus + i,
        .input-wrapper:focus-within i {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        select.form-control {
            padding-left: 50px;
            cursor: pointer;
            appearance: none;
        }

        select.form-control option {
            background: #333;
            color: white;
        }

        .select-arrow {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            pointer-events: none;
        }

        .password-strength {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

        .password-strength-bar {
            height: 100%;
            width: 0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 25px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .terms-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #ff6b6b;
            cursor: pointer;
            margin-top: 2px;
        }

        .terms-check a {
            color: white;
            font-weight: 600;
            text-decoration: none;
            position: relative;
        }

        .terms-check a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        .terms-check a:hover::after {
            width: 100%;
        }

        .register-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f, #f093fb);
            background-size: 200% 200%;
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            animation: gradientBtn 3s ease infinite;
        }

        @keyframes gradientBtn {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 107, 107, 0.6);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .register-btn i {
            margin-right: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            padding: 0 20px;
        }

        .social-register {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .social-btn span {
            font-size: 14px;
            font-weight: 500;
        }

        .login-link {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
        }

        .login-link a {
            color: white;
            font-weight: 700;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: white;
            transition: width 0.3s ease;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        /* Floating decorative elements */
        .float-element {
            position: absolute;
            z-index: 5;
            animation: floatY 6s ease-in-out infinite;
        }

        .float-element:nth-child(1) {
            top: 10%;
            left: 5%;
            font-size: 30px;
            color: rgba(255, 255, 255, 0.3);
            animation-delay: 0s;
        }

        .float-element:nth-child(2) {
            top: 60%;
            right: 5%;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.2);
            animation-delay: 2s;
        }

        .float-element:nth-child(3) {
            bottom: 20%;
            left: 8%;
            font-size: 25px;
            color: rgba(255, 255, 255, 0.25);
            animation-delay: 4s;
        }

        @keyframes floatY {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Responsive */
        @media (max-width: 576px) {
            .register-card {
                padding: 30px 20px;
            }
            
            .header-section h2 {
                font-size: 26px;
            }
            
            .social-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background Shapes -->
    <div class="shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Floating Elements -->
    <div class="float-element"><i class="fas fa-shopping-bag"></i></div>
    <div class="float-element"><i class="fas fa-heart"></i></div>
    <div class="float-element"><i class="fas fa-star"></i></div>

    <div class="register-container">
        <div class="register-card">
            <div class="card-content">
                <div class="header-section">
                    <div class="header-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h2>Create Account</h2>
                    <p>Join our amazing shopping community today!</p>
                </div>

                <form th:action="@{/register}" method="post" th:object="${user}">
                    <div class="form-group">
                        <label>Username</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-control" th:field="*{username}" placeholder="Choose a username" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control" th:field="*{email}" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-control" th:field="*{userpassword}" placeholder="Create a password" required>
                        </div>
                        <div class="password-strength">
                            <div class="password-strength-bar"></div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Account Type</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user-tag"></i>
                            <select class="form-control" th:field="*{role}">
                                <option value="CUSTOMER">Customer - Shop & Buy</option>
                                <option value="RETAILER">Retailer - Sell Products</option>
                                <option value="ADMIN">Administrator</option>
                            </select>
                            <i class="fas fa-chevron-down select-arrow"></i>
                        </div>
                    </div>

                    <div class="terms-check">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
                    </div>

                    <button type="submit" class="register-btn">
                        <i class="fas fa-rocket"></i> Create Account
                    </button>
                </form>

                <div class="divider">
                    <span>OR SIGN UP WITH</span>
                </div>

                <div class="social-register">
                    <button class="social-btn">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>

                <div class="login-link">
                    Already have an account? <a href="/login">Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
