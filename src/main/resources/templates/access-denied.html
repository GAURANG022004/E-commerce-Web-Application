<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Restricted Area</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #e94560 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-container {
            max-width: 500px;
            width: 100%;
            animation: shake 0.6s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .error-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            text-align: center;
            padding: 50px 40px;
        }
        .error-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(233, 69, 96, 0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(233, 69, 96, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 25px 50px rgba(233, 69, 96, 0.6); }
        }
        .error-icon i {
            font-size: 50px;
            color: white;
        }
        .error-code {
            font-size: 72px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
        }
        .error-message {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            margin-bottom: 10px;
        }
        .error-hint {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border-left: 4px solid #e94560;
        }
        .btn-glass {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 5px;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }
        .btn-glass-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-glass-primary:hover {
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .shape {
            position: absolute;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }
        .shape-1 {
            top: 10%;
            left: 10%;
            font-size: 100px;
            color: #e94560;
            animation-delay: 0s;
        }
        .shape-2 {
            top: 70%;
            right: 10%;
            font-size: 80px;
            color: #667eea;
            animation-delay: 5s;
        }
        .shape-3 {
            bottom: 10%;
            left: 30%;
            font-size: 60px;
            color: #f093fb;
            animation-delay: 10s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(120deg); }
            66% { transform: translateY(30px) rotate(240deg); }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <i class="fas fa-shield-alt shape shape-1"></i>
        <i class="fas fa-lock shape shape-2"></i>
        <i class="fas fa-exclamation-triangle shape shape-3"></i>
    </div>

    <div class="error-container">
        <div class="error-card">
            <div class="error-icon">
                <i class="fas fa-ban"></i>
            </div>
            <div class="error-code">403</div>
            <h1 class="error-title">Access Denied</h1>
            <p class="error-message">
                <i class="fas fa-user-lock me-2"></i>
                You don't have permission to access this resource.
            </p>
            <div class="error-hint">
                <i class="fas fa-info-circle me-2"></i>
                Your account role does not have the required privileges to view this page. 
                Please contact an administrator if you believe this is a mistake.
            </div>
            <div class="d-flex justify-content-center flex-wrap">
                <a th:href="@{/products}" class="btn-glass btn-glass-primary">
                    <i class="fas fa-arrow-left me-2"></i>Go to Products
                </a>
                <a th:href="@{/logout}" class="btn-glass">
                    <i class="fas fa-sign-out-alt me-2"></i>Logout
                </a>
            </div>
        </div>
    </div>
</body>
</html>
