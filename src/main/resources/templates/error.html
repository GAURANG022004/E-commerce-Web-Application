<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .error-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            color: #dc3545;
        }

        .message {
            margin: 20px 0;
            font-size: 18px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="error-container">

    <h1>Something went wrong</h1>

    <div class="message" th:text="${errorMessage}">
        An error occurred.
    </div>

    <a th:href="@{/products}">
        Continue Shopping
    </a>

</div>

</body>
</html>
