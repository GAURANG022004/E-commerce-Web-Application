<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog | Shop Amazing Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism Header */
        .page-header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            background: linear-gradient(135deg, #fff, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        /* Glass Button Styles */
        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            color: white;
        }

        .btn-glass-light {
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
            border: none;
        }

        .btn-glass-light:hover {
            background: white;
            color: #667eea;
        }

        /* Search & Filter Container */
        .search-filter-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .search-input {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 20px 12px 50px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-input:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
        }

        .category-select {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 20px;
            cursor: pointer;
        }

        .category-select option {
            background: #764ba2;
            color: white;
        }

        /* 3D Product Cards */
        .product-card-wrapper {
            perspective: 1000px;
            margin-bottom: 2rem;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-15px) rotateX(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }

        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 220px;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-image {
            transform: scale(1.1);
        }

        .product-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .product-card:hover .product-overlay {
            opacity: 1;
        }

        .quick-view-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9);
            color: #764ba2;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .product-card:hover .quick-view-btn {
            opacity: 1;
        }

        .card-body {
            padding: 1.5rem;
            color: white;
        }

        .product-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: white;
        }

        .product-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .category-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stock-badge {
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            border: 2px solid;
        }

        .stock-high {
            background: rgba(25, 135, 84, 0.9);
            color: #ffffff;
            border-color: #198754;
            box-shadow: 0 2px 8px rgba(25, 135, 84, 0.4);
        }

        .stock-medium {
            background: rgba(255, 193, 7, 0.95);
            color: #000000;
            border-color: #ffc107;
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.4);
        }

        .stock-low {
            background: rgba(220, 53, 69, 0.9);
            color: #ffffff;
            border-color: #dc3545;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.4);
        }

        /* Action Buttons */
        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .action-btn.edit {
            background: rgba(102, 126, 234, 0.3);
        }

        .action-btn.delete {
            background: rgba(220, 53, 69, 0.3);
        }

        .add-to-cart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .quantity-input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 60px;
            text-align: center;
            border-radius: 10px;
            padding: 8px;
        }

        .quantity-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .empty-state i {
            font-size: 5rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 1.5rem;
        }

        .empty-state h3 {
            color: white;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .empty-state p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1.5rem;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 3rem;
            padding: 2rem;
        }

        .page-link {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .page-link:hover, .page-link.active {
            background: rgba(255, 255, 255, 0.4);
            color: white;
        }

        .items-per-page {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-card {
            animation: fadeInUp 0.6s ease forwards;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-title {
                font-size: 1.8rem;
            }
            
            .product-card:hover {
                transform: translateY(-10px);
            }
        }
    </style>
</head>
<body>
    <!-- Glassmorphism Header -->
    <div class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h1 class="header-title"><i class="fas fa-store me-3"></i>Product Catalog</h1>
                    <p class="header-subtitle">Discover amazing products at incredible prices</p>
                </div>
                <div class="d-flex gap-3">
                    <a href="/products/new" class="btn btn-glass btn-glass-light">
                        <i class="fas fa-plus-circle me-2"></i>Add Product
                    </a>
                    <a href="/cart" class="btn btn-glass">
                        <i class="fas fa-shopping-cart me-2"></i>View Cart
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-4">
        <!-- Search and Filter Container -->
        <div class="search-filter-container">
            <div class="row g-4 align-items-center">
                <div class="col-lg-8">
                    <form action="/products/search" method="get">
                        <div class="position-relative">
                            <i class="fas fa-search search-icon"></i>
                            <input type="text" name="keyword" class="search-input w-100" placeholder="Search for products, brands, categories...">
                        </div>
                    </form>
                </div>
                <div class="col-lg-4">
                    <form action="/products/filter" method="get" class="d-flex gap-2">
                        <select name="category" class="category-select flex-grow-1">
                            <option value="">All Categories</option>
                            <option value="Electronic">Electronic</option>
                            <option value="Gadgets">Gadgets</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Toys">Toys</option>
                            <option value="Men-Garments">Fashion</option>
                        </select>
                        <button type="submit" class="btn btn-glass">
                            <i class="fas fa-filter"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Product Cards Grid -->
        <div class="row g-4">
            <div th:each="product, iterStat: ${products}" class="col-lg-4 col-md-6 product-card-wrapper">
                <div class="product-card animate-card" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">
                    <div class="product-image-container">
                        <img th:src="${product.imageurl}" alt="Product Image" class="product-image" 
                             onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">
                        <div class="product-overlay"></div>
                        <button class="quick-view-btn">Quick View</button>
                    </div>
                    
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="product-title" th:text="${product.name}">Product Name</h5>
                            <span class="product-price" th:text="'$' + ${product.price}">$0.00</span>
                        </div>
                        
                        <p class="product-description" th:text="${product.description}">Product description</p>
                        
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="category-badge" th:text="${product.category}">Category</span>
                            <span class="stock-badge" 
                                  th:classappend="${product.stock > 50} ? 'stock-high' : (${product.stock > 20} ? 'stock-medium' : 'stock-low')"
                                  th:text="${product.stock > 50} ? 'In Stock' : (${product.stock > 20} ? 'Low Stock' : 'Critical')">Stock</span>
                        </div>
                        
                        <div class="d-flex gap-2 mb-3">
                            <a th:href="@{'/products/edit/' + ${product.id}}" class="action-btn edit flex-fill text-center">
                                <i class="fas fa-edit me-1"></i>Edit
                            </a>
                            <a th:href="@{'/products/delete/' + ${product.id}}" class="action-btn delete flex-fill text-center">
                                <i class="fas fa-trash me-1"></i>Delete
                            </a>
                        </div>
                        
                        <form th:action="@{'/add/' + ${product.id}}" method="get">
                            <div class="d-flex gap-2">
                                <input type="number" name="quantity" value="1" min="1" class="quantity-input">
                                <button type="submit" class="add-to-cart-btn">
                                    <i class="fas fa-cart-plus me-2"></i>Add to Cart
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${products.empty}" class="empty-state">
            <i class="fas fa-box-open"></i>
            <h3>No Products Found</h3>
            <p>Try adjusting your search or filter criteria</p>
            <a href="/products" class="btn btn-glass btn-glass-light">
                <i class="fas fa-redo me-2"></i>View All Products
            </a>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" th:if="${totalPages > 1}">
            <nav>
                <ul class="pagination pagination-glass">
                    <li th:each="i : ${#numbers.sequence(0, totalPages-1)}" 
                        th:classappend="${i == currentPage} ? 'active' : ''">
                        <a class="page-link" th:href="@{'/products?page=' + ${i} + '&size=' + ${size}}" 
                           th:text="${i + 1}">1</a>
                    </li>
                </ul>
            </nav>
            <form method="get" action="/products">
                <select name="size" class="items-per-page" onchange="this.form.submit()">
                    <option th:value="5" th:selected="${size == 5}">5 per page</option>
                    <option th:value="10" th:selected="${size == 10}">10 per page</option>
                    <option th:value="20" th:selected="${size == 20}">20 per page</option>
                </select>
                <input type="hidden" name="page" th:value="${currentPage}" />
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
