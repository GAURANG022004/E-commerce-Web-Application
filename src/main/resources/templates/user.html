<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Amazing Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        .page-header {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 2rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: white;
        }
        /* User Dropdown Styles */
        .user-dropdown {
            position: relative;
        }
        .user-trigger {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        .user-trigger:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }
        .user-name {
            font-size: 14px;
            font-weight: 500;
            color: white;
        }
        .user-trigger i {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
        }
        .dropdown-menu-custom {
            position: absolute;
            right: 0;
            top: 55px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            min-width: 180px;
            padding: 8px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s;
            z-index: 1001;
        }
        .user-dropdown:hover .dropdown-menu-custom {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dropdown-item-custom {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
        }
        .dropdown-item-custom:hover {
            background: #f8fafc;
            color: #ef4444;
        }
        .search-filter-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 2rem;
            margin-bottom: 3rem;
        }
        .search-input {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 20px 12px 50px;
        }
        .search-input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .search-input:focus {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            color: white;
            outline: none;
        }
        .category-select {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            padding: 12px 20px;
        }
        .product-card-wrapper { perspective: 1000px; margin-bottom: 2rem; }
        .product-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-15px) rotateX(5deg);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
        }
        .product-image-container {
            position: relative;
            overflow: hidden;
            height: 220px;
        }
        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .product-card:hover .product-image { transform: scale(1.1); }
        .card-body { padding: 1.5rem; color: white; }
        .product-title { font-size: 1.25rem; font-weight: 600; color: white; }
        .product-price {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .category-badge {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .add-to-cart-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .add-to-cart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
        }
        .empty-state i { font-size: 5rem; color: rgba(255, 255, 255, 0.5); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card { animation: fadeInUp 0.6s ease forwards; }
    </style>
</head>
<body>
    <div class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h1 class="header-title"><i class="fas fa-store me-3"></i>Shop Products</h1>
                    <p class="text-white-50 mb-0">Discover amazing products at great prices</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <a href="/cart" class="btn-glass">
                        <i class="fas fa-shopping-cart"></i>My Cart
                    </a>
                    <div class="user-dropdown">
                        <div class="user-trigger">
                            <div class="user-avatar" th:text="${session.user?.username != null ? session.user.username.substring(0,1).toUpperCase() : 'U'}">U</div>
                            <span class="user-name" th:text="${session.user?.username ?: 'User'}">User</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                        <div class="dropdown-menu-custom">
                            <a href="/logout" class="dropdown-item-custom">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>Logout</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-4">
        <div class="search-filter-container">
            <div class="row g-4">
                <div class="col-lg-8">
                    <form action="/products/search" method="get">
                        <div class="position-relative">
                            <i class="fas fa-search" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.7);"></i>
                            <input type="text" name="keyword" class="search-input w-100" placeholder="Search products...">
                        </div>
                    </form>
                </div>
                <div class="col-lg-4">
                    <form action="/products/filter" method="get" class="d-flex gap-2">
                        <select name="category" class="category-select flex-grow-1">
                            <option value="">All Categories</option>
                            <option value="Electronic">Electronic</option>
                            <option value="Gadgets">Gadgets</option>
                            <option value="Groceries">Groceries</option>
                            <option value="Toys">Toys</option>
                            <option value="Men-Garments">Fashion</option>
                        </select>
                        <button type="submit" class="btn-glass"><i class="fas fa-filter"></i></button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div th:each="product, iterStat: ${products}" class="col-lg-4 col-md-6 product-card-wrapper">
                <div class="product-card animate-card" th:style="'animation-delay: ' + ${iterStat.index * 0.1} + 's'">
                    <div class="product-image-container">
                        <img th:src="${product.imageurl}" alt="Product" class="product-image" 
                             onerror="this.src='https://via.placeholder.com/300x220?text=No+Image'">
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <h5 class="product-title" th:text="${product.name}">Product</h5>
                            <span class="product-price" th:text="'$' + ${product.price}">$0</span>
                        </div>
                        <p class="text-white-50 small mb-3" th:text="${product.description}">Description</p>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="category-badge" th:text="${product.category}">Category</span>
                        </div>
                        <form th:action="@{'/add/' + ${product.id}}" method="get">
                            <div class="d-flex gap-2">
                                <input type="number" name="quantity" value="1" min="1" class="form-control" style="width: 70px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; border-radius: 10px; text-align: center;">
                                <button type="submit" class="add-to-cart-btn">
                                    <i class="fas fa-cart-plus me-2"></i>Add to Cart
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${products.empty}" class="empty-state">
            <i class="fas fa-box-open"></i>
            <h3 class="text-white">No Products Found</h3>
            <p class="text-white-50">Try adjusting your search criteria</p>
            <a href="/products" class="btn-glass mt-3"><i class="fas fa-redo me-2"></i>View All</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
